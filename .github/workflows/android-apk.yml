name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/android-companion/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'app/android-companion/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: app/android-companion
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build APK and run Android Lint
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify and package APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/roads-region-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/roads-region-debug.apk
          cd artifacts
          sha256sum roads-region-debug.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nRun: %s/%s/actions/runs/%s\nAndroid 8.0 or newer. Test build; not for Play Store.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD-INFO.txt
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roads-region-debug-${{ github.run_number }}
          path: app/android-companion/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-${{ github.run_number }}
          path: app/android-companion/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
      - name: Installation instructions
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '## Дороги области — тестовый APK'
            printf '[Скачать архив с APK](%s)\n\n' "$ARTIFACT_URL"
            echo 'Распакуйте архив и установите roads-region-debug.apk на Android 8.0 или новее.'
            echo 'Введите HTTPS-адрес приложения, доступный телефону. localhost телефона не указывает на компьютер.'
            echo 'Фоновый GPS пока сохраняется локально; передача на сервер не включена.'
            echo 'Сборка и Lint не заменяют проверку записи GPS на реальном телефоне.'
          } >> "$GITHUB_STEP_SUMMARY"
