services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roads
      POSTGRES_USER: roads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roads_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roads -d roads"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  roads_pg:
